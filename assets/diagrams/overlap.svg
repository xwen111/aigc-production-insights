<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc"><title id="title">重叠生成怎样变成剪辑余量</title><desc id="desc">组 A 生成剧情一二三，B 生成二三四，C 生成三四五。相同剧情有多个演法，最终剪辑分别选用局部，不重复播放相同剧情。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#29372d}.small{font-size:13px;fill:#697567}.label{font-size:17px;font-weight:600}.wire{fill:none;stroke:#687d65;stroke-width:2;marker-end:url(#arrow)}.repair{stroke:#b47644}.discover{stroke:#427e86;stroke-dasharray:7 4}</style><rect width="100%" height="100%" fill="#fafbf8"/><text class="label" x="24" y="32">同一场景里，给相邻剧情留下重演的部分</text><text class="small" x="200" y="73">剧情 1</text><text class="small" x="355" y="73">剧情 2</text><text class="small" x="510" y="73">剧情 3</text><text class="small" x="665" y="73">剧情 4</text><text class="small" x="820" y="73">剧情 5</text><text class="label" x="24" y="130">生成组 A</text><rect x="175" y="95" width="140" height="56" fill="#edf2e7" stroke="#9fb694"/><text x="200" y="130" font-size="16">剧情 1</text><rect x="330" y="95" width="140" height="56" fill="#edf2e7" stroke="#9fb694"/><text x="355" y="130" font-size="16">剧情 2</text><rect x="485" y="95" width="140" height="56" fill="#edf2e7" stroke="#9fb694"/><text x="510" y="130" font-size="16">剧情 3</text><text class="label" x="24" y="206">生成组 B</text><rect x="330" y="171" width="140" height="56" fill="#dbe8d4" stroke="#9fb694"/><text x="355" y="206" font-size="16">剧情 2</text><rect x="485" y="171" width="140" height="56" fill="#dbe8d4" stroke="#9fb694"/><text x="510" y="206" font-size="16">剧情 3</text><rect x="640" y="171" width="140" height="56" fill="#dbe8d4" stroke="#9fb694"/><text x="665" y="206" font-size="16">剧情 4</text><text class="label" x="24" y="282">生成组 C</text><rect x="485" y="247" width="140" height="56" fill="#c7dcbc" stroke="#9fb694"/><text x="510" y="282" font-size="16">剧情 3</text><rect x="640" y="247" width="140" height="56" fill="#c7dcbc" stroke="#9fb694"/><text x="665" y="282" font-size="16">剧情 4</text><rect x="795" y="247" width="140" height="56" fill="#c7dcbc" stroke="#9fb694"/><text x="820" y="282" font-size="16">剧情 5</text><text class="small" x="24" y="337">剪辑时：</text><rect x="175" y="308" width="140" height="48" fill="#526d49"/><text x="190" y="338" style="fill:white;font-size:14px">从 A 选这一段</text><rect x="330" y="308" width="140" height="48" fill="#526d49"/><text x="345" y="338" style="fill:white;font-size:14px">从 B 选这一段</text><rect x="485" y="308" width="140" height="48" fill="#526d49"/><text x="500" y="338" style="fill:white;font-size:14px">从 B 选这一段</text><rect x="640" y="308" width="140" height="48" fill="#526d49"/><text x="655" y="338" style="fill:white;font-size:14px">从 C 选这一段</text><rect x="795" y="308" width="140" height="48" fill="#526d49"/><text x="810" y="338" style="fill:white;font-size:14px">从 C 选这一段</text><text class="small" x="175" y="388">重复剧情不重复讲：从不同演法里找更好的瞬间与接点。</text><text class="small" x="175" y="414">这只是示意，窗口大小、候选数量和切点按实际剧情决定。</text></svg>
