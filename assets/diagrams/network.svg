<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="655" viewBox="0 0 1150 655" role="img" aria-labelledby="title desc"><title id="title">AIGC 素材怎样分叉、汇合与回流</title><desc id="desc">视频既能进入选片剪辑，也能抽帧给图片模型修改；修好的图片再生成或合成为替换视频，接回剪辑。视频中的新道具也能提取为后续参考。多个候选可以分别贡献局部片段。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#29372d}.small{font-size:13px;fill:#697567}.label{font-size:17px;font-weight:600}.wire{fill:none;stroke:#687d65;stroke-width:2;marker-end:url(#arrow)}.repair{stroke:#b47644}.discover{stroke:#427e86;stroke-dasharray:7 4}</style><rect width="100%" height="100%" fill="#fafbf8"/><rect x="30" y="35" width="190" height="76" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="44" y="64">故事、情绪与要求</text><text class="small" x="44" y="89">保留可以再改的方向</text><rect x="300" y="35" width="190" height="76" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="314" y="64">图片探索</text><text class="small" x="314" y="89">选中有感觉的实际图</text><rect x="600" y="35" width="190" height="76" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="614" y="64">选图后精确修改</text><text class="small" x="614" y="89">个性、文字、必要角度</text><rect x="900" y="35" width="190" height="76" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="914" y="64">这一段用的参考</text><text class="small" x="914" y="89">角色 / 环境 / 关键细节</text><path class="wire" d="M220 73H300"/><path class="wire" d="M490 73H600"/><path class="wire" d="M790 73H900"/><path class="wire" d="M995 111V245"/><text class="small" x="1006" y="180">带剧情生成</text><rect x="910" y="233" width="190" height="115" rx="5" fill="#dde5d7"/><rect x="905" y="239" width="190" height="115" rx="5" fill="#e9eee3"/><rect x="900" y="245" width="190" height="115" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="914" y="274">同一段戏，几种演法</text><text class="small" x="914" y="299">A / B / C 都是素材</text><text class="small" x="915" y="328">每条都可能只有局部好</text><rect x="600" y="260" width="190" height="95" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="614" y="289">从每条里挑几秒</text><text class="small" x="614" y="314">A 的前段 + B 的反应</text><path class="wire" d="M900 278H790"/><path class="wire" d="M900 304H790"/><path class="wire" d="M900 337H790"/><rect x="300" y="260" width="190" height="95" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="314" y="289">组合、试剪</text><text class="small" x="314" y="314">放到前后镜头里看</text><rect x="30" y="260" width="190" height="95" rx="5" fill="#f2f5ee" stroke="#c7d2c2"/><text class="label" x="44" y="289">连着看整片</text><text class="small" x="44" y="314">表达成立、素材够用</text><path class="wire" d="M600 307H490"/><path class="wire" d="M300 307H220"/><path class="wire repair" d="M995 360V425"/><text class="small" x="1006" y="397">取一帧出来</text><rect x="900" y="425" width="190" height="76" rx="5" fill="#fbf0e5" stroke="#c7d2c2"/><text class="label" x="914" y="454">视频抽帧</text><text class="small" x="914" y="479">视频输出 → 图片输入</text><rect x="600" y="425" width="190" height="76" rx="5" fill="#fbf0e5" stroke="#c7d2c2"/><text class="label" x="614" y="454">图片精修</text><text class="small" x="614" y="479">保住构图，修字或细节</text><rect x="300" y="425" width="190" height="76" rx="5" fill="#fbf0e5" stroke="#c7d2c2"/><text class="label" x="314" y="454">局部再生成 / 合成</text><text class="small" x="314" y="479">修好的图 → 替换视频</text><path class="wire repair" d="M900 463H790"/><path class="wire repair" d="M600 463H490"/><path class="wire repair" d="M395 425V355"/><text class="small" x="407" y="392">接回试剪，检查动作与文字稳定</text><path class="wire repair" d="M490 330H540V535H695V501"/><text class="small" x="365" y="553">接回仍不自然 → 回到图片修改</text><path class="wire" d="M600 280C565 280 565 185 700 185H865V270H900"/><text class="small" x="620" y="170">缺一个动作 / 表情 → 定向补拍</text><path class="wire discover" d="M995 501V555"/><rect x="900" y="555" width="190" height="76" rx="5" fill="#eaf3f3" stroke="#c7d2c2"/><text class="label" x="914" y="584">提取新道具参考</text><text class="small" x="914" y="609">袋子、手表先在视频出现</text><path class="wire discover" d="M1090 593H1125V73H1090"/><text class="small" x="600" y="581">新发现回到参考库，供后续镜头延续</text><text class="small" x="30" y="565">绿色：生成、选择与组合</text><text class="small" x="30" y="590">棕色：抽帧 → 改图 → 替换视频 → 接回</text><text class="small" x="30" y="615">蓝色虚线：从视频发现并提取新参考</text></svg>
